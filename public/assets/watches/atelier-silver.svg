<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="caseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E5E7EB"/>
      <stop offset="100%" stop-color="#9CA3AF"/>
    </linearGradient>

    <radialGradient id="dialGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FAFAF9"/>
      <stop offset="85%" stop-color="#050506"/>
    </radialGradient>

    <filter id="shadowDepth" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <g filter="url(#shadowDepth)">
    <!-- Strap / Bracelet -->
    
      <!-- Stitched Leather Strap -->
      <path d="M 235 40 L 365 40 L 358 185 L 242 185 Z" fill="#1C1917" rx="4"/>
      <path d="M 242 415 L 358 415 L 365 560 L 235 560 Z" fill="#1C1917" rx="4"/>
      <!-- Contrast Stitching -->
      <line x1="248" y1="50" x2="252" y2="175" stroke="#FDE68A" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.8"/>
      <line x1="352" y1="50" x2="348" y2="175" stroke="#FDE68A" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.8"/>
      <line x1="252" y1="425" x2="248" y2="550" stroke="#FDE68A" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.8"/>
      <line x1="348" y1="425" x2="352" y2="550" stroke="#FDE68A" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.8"/>
    

    <!-- Lugs -->
    <path d="M 220 160 L 245 140 L 265 190 L 220 230 Z" fill="url(#caseGrad)"/>
    <path d="M 380 160 L 355 140 L 335 190 L 380 230 Z" fill="url(#caseGrad)"/>
    <path d="M 220 440 L 245 460 L 265 410 L 220 370 Z" fill="url(#caseGrad)"/>
    <path d="M 380 440 L 355 460 L 335 410 L 380 370 Z" fill="url(#caseGrad)"/>

    <!-- Crown -->
    <rect x="468" y="285" width="20" height="30" rx="3" fill="url(#caseGrad)"/>
    <line x1="474" y1="287" x2="474" y2="313" stroke="#27272A" stroke-width="1.5"/>
    <line x1="480" y1="287" x2="480" y2="313" stroke="#27272A" stroke-width="1.5"/>

    <!-- Case Body -->
    <circle cx="300" cy="300" r="172" fill="url(#caseGrad)"/>
    
    <!-- Bezel -->
    <circle cx="300" cy="300" r="158" fill="#D1D5DB" stroke="#374151" stroke-width="1.5"/>
    <circle cx="300" cy="300" r="145" fill="#090A0C"/>

    <!-- Dial Face -->
    <circle cx="300" cy="300" r="140" fill="url(#dialGrad)"/>

    <!-- Markers -->
    <rect x="297.0" y="172.0" width="6" height="16" rx="1.5" transform="rotate(0, 300.0, 180.0)" fill="#44403C"/>
    <rect x="358.0" y="188.1" width="4" height="16" rx="1.5" transform="rotate(30, 360.0, 196.1)" fill="#44403C"/>
    <rect x="401.9" y="232.0" width="4" height="16" rx="1.5" transform="rotate(60, 403.9, 240.0)" fill="#44403C"/>
    <rect x="417.0" y="292.0" width="6" height="16" rx="1.5" transform="rotate(90, 420.0, 300.0)" fill="#44403C"/>
    <rect x="401.9" y="352.0" width="4" height="16" rx="1.5" transform="rotate(120, 403.9, 360.0)" fill="#44403C"/>
    <rect x="358.0" y="395.9" width="4" height="16" rx="1.5" transform="rotate(150, 360.0, 403.9)" fill="#44403C"/>
    <rect x="297.0" y="412.0" width="6" height="16" rx="1.5" transform="rotate(180, 300.0, 420.0)" fill="#44403C"/>
    <rect x="238.0" y="395.9" width="4" height="16" rx="1.5" transform="rotate(210, 240.0, 403.9)" fill="#44403C"/>
    <rect x="194.1" y="352.0" width="4" height="16" rx="1.5" transform="rotate(240, 196.1, 360.0)" fill="#44403C"/>
    <rect x="177.0" y="292.0" width="6" height="16" rx="1.5" transform="rotate(270, 180.0, 300.0)" fill="#44403C"/>
    <rect x="194.1" y="232.0" width="4" height="16" rx="1.5" transform="rotate(300, 196.1, 240.0)" fill="#44403C"/>
    <rect x="238.0" y="188.1" width="4" height="16" rx="1.5" transform="rotate(330, 240.0, 196.1)" fill="#44403C"/>

    <!-- Branding -->
    <text x="300" y="245" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">LUMI</text>
    <text x="300" y="258" font-family="'Plus Jakarta Sans', sans-serif" font-size="6" font-weight="600" fill="#9CA3AF" text-anchor="middle" letter-spacing="2">ATELIER</text>

    <!-- Hands -->
    <!-- Hour Hand -->
    <g transform="translate(300, 300) rotate(-60)">
      <path d="M -3 0 L -2 -65 L 0 -80 L 2 -65 L 3 0 Z" fill="#1C1917"/>
      <rect x="-1" y="-60" width="2" height="45" fill="#18181B"/>
    </g>
    <!-- Minute Hand -->
    <g transform="translate(300, 300) rotate(50)">
      <path d="M -2.5 0 L -1.5 -95 L 0 -115 L 1.5 -95 L 2.5 0 Z" fill="#1C1917"/>
      <rect x="-1" y="-90" width="2" height="70" fill="#18181B"/>
    </g>
    <!-- Center Cap -->
    <circle cx="300" cy="300" r="6" fill="#1C1917"/>
    <circle cx="300" cy="300" r="2.5" fill="#18181B"/>
    <!-- Seconds Hand -->
    <line x1="300" y1="330" x2="300" y2="180" stroke="#EF4444" stroke-width="1.2"/>
    <circle cx="300" cy="300" r="2" fill="#EF4444"/>
  </g>
</svg>