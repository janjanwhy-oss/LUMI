      <line x1="458" y1="560" x2="463" y2="680" stroke="#FFFFFF" stroke-width="1.5" opacity="0.7"/>
      <line x1="542" y1="560" x2="537" y2="680" stroke="#FFFFFF" stroke-width="1.5" opacity="0.7"/>
    </g>

    <!-- Watch Lugs (Faceted Steel Corners) -->
